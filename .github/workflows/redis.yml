name: Redis

on:
  push:
    branches: [ main ]
    paths:
      - 'redis/**'
      - '!redis/CloudronVersions.json'
      - .github/workflows/redis.yml
      - .github/workflows/package.yml
  pull_request:
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/package.yml
    with:
      app: redis
      ref: ${{ github.sha }}
      publish: ${{ github.event_name != 'pull_request' }}
