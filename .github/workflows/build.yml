name: Build and publish

# Builds the image, runs the smoke tests and - if the manifest version is not yet
# in CloudronVersions.json - pushes the image to GHCR, records the version in
# CloudronVersions.json and creates a GitHub release. Cloudron installations that
# added this package as a community app pick the new version up from there.

on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - start.sh
      - config.json.template
      - env.sh.template
      - CloudronManifest.json
      - CHANGELOG.md
      - DESCRIPTION.md
      - POSTINSTALL.md
      - logo.png
      - test/**
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read manifest
        id: meta
        run: |
          version=$(jq -r .version CloudronManifest.json)
          image=$(jq -r .dockerImage CloudronManifest.json)
          upstream=$(jq -r .upstreamVersion CloudronManifest.json)
          [[ "${image}" == *":${version}" ]] || { echo "dockerImage tag must equal version (${image} vs ${version})"; exit 1; }
          grep -q "^ARG SOCKUDO_VERSION=${upstream}$" Dockerfile || { echo "Dockerfile SOCKUDO_VERSION does not match upstreamVersion ${upstream}"; exit 1; }
          grep -q "^\[${version}\]$" CHANGELOG.md || { echo "CHANGELOG.md has no [${version}] section"; exit 1; }
          published=false
          if [[ -f CloudronVersions.json ]] && jq -e --arg v "${version}" '.versions[$v]' CloudronVersions.json > /dev/null; then
            published=true
          fi
          if [[ "${published}" == "true" ]]; then
            echo "::notice::${version} is already published - building and testing only. Bump the version in CloudronManifest.json to publish."
          fi
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "upstream=${upstream}"
            echo "published=${published}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --pull -t cloudron-sockudo:test .

      - name: Smoke test
        run: bash test/smoke.sh cloudron-sockudo:test

      - name: Server log
        if: always()
        run: cat /tmp/sockudo-smoke.log || true

      - name: Push image
        if: steps.meta.outputs.published == 'false' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag cloudron-sockudo:test "${IMAGE}"
          docker tag cloudron-sockudo:test "${IMAGE%:*}:latest"
          docker push "${IMAGE}"
          docker push "${IMAGE%:*}:latest"

      - name: Record version and release
        if: steps.meta.outputs.published == 'false' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          [[ "$(jq -r .version CloudronManifest.json)" == "${VERSION}" ]] || { echo "main moved on to another version, not recording ${VERSION}"; exit 1; }
          python3 scripts/add-version.py
          git add CloudronVersions.json
          git commit -m "Publish ${VERSION} (Sockudo ${UPSTREAM})"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"
          awk -v ver="[${VERSION}]" '$0 == ver { found=1; next } found && /^\[/ { exit } found { print }' CHANGELOG.md > /tmp/notes.md
          printf '\nImage: `%s`\n' "${IMAGE}" >> /tmp/notes.md
          gh release create "v${VERSION}" --title "${VERSION} (Sockudo ${UPSTREAM})" --notes-file /tmp/notes.md
